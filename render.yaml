services:
  - type: web
    name: mota-scholarship-system
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
